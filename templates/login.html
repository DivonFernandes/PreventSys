{% extends "base.html" %}

{% block title %}BeneficSeeds | Login{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        background-color: var(--branco);
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        padding: 2.5rem;
        width: 100%;
        max-width: 400px;
        margin: 2rem auto;
    }

    .login-container h2 {
        color: var(--verde-oliva);
        font-family: 'Merriweather', serif;
        font-weight: 700;
        margin-bottom: 1.5rem;
    }

    .login-container .form-label {
        color: var(--cinza-ardosia);
        font-weight: 600;
        margin-bottom: 0.5rem;
    }

    .login-container .form-control {
        border: 2px solid #e9ecef;
        border-radius: 8px;
        padding: 0.75rem;
        color: var(--cinza-ardosia);
    }

    .login-container .form-control:focus {
        border-color: var(--verde-oliva);
        box-shadow: 0 0 0 0.2rem rgba(85, 107, 47, 0.25);
        color: var(--cinza-ardosia);
    }

    .login-container .alert-danger {
        background-color: #f8d7da;
        border-color: #f5c6cb;
        color: #721c24;
        border-radius: 8px;
        padding: 0.75rem;
    }

    .login-container a {
        color: var(--verde-oliva);
        text-decoration: none;
        font-weight: 600;
    }

    .login-container a:hover {
        color: var(--amarelo-dourado);
        text-decoration: underline;
    }

    .container {
        background: transparent !important;
    }

    footer {
        color: var(--branco);
        opacity: 0.8;
        margin-top: 1rem;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="login-container text-center">
        <h2 class="mb-4">Acesso ao Sistema</h2>
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post">
            <div class="mb-3 text-start">
                <label for="username" class="form-label">Usuário</label>
                <input type="text" class="form-control" id="username" name="username" required>
            </div>
            <div class="mb-4 text-start">
                <label for="password" class="form-label">Senha</label>
                <input type="password" class="form-control" id="password" name="password" required>
            </div>
            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-primary btn-lg">Entrar</button>
            </div>
        </form>
        <div class="text-center mt-3">
            <a href="/">← Voltar ao Início</a>
        </div>
    </div>
    <footer>© 2025 BeneficSeeds | Ciência e Crescimento</footer>
</div>
{% endblock %}
